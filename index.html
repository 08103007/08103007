iao hàng quá thời hạn được quy định ở điều 3, thì sẽ chịu phạt với lãi suất 0.2%/tuần trên giá trị hàng giao trễ nhưng không tính 1 tuần đầu. Tuy nhiên, tổng số tiền phạt không được vượt quá 2% tổng giá trị Hợp Đồng.",art4_1B:"4.1 If the Seller fails to deliver commodity on time as the regulation of Article 3, the Seller shall pay for penalty of 0.2%/week of the delayed value except the first week as grace period. However, total of compensation shall not exceed 2% of the total contract value.",art4_2:"4.2 Nếu bên Mua chậm thanh toán quá thời hạn được quy định ở điều 2, thì sẽ chịu phạt với lãi suất 0.2%/tuần trên giá trị thanh toán trễ. Tuy nhiên, tổng số tiền phạt không được vượt quá 2% tổng giá trị Hợp Đồng.",art4_2B:"4.2 If the Buyer fails to make payment on time as the regulation of Article 2, the Buyer shall pay for penalty of 0.2% of the delayed value per week. However, total of compensation shall not exceed 2% of the total contract value.",art4_3:"4.3 Điều khoản này sẽ không được áp dụng trong trường hợp Bất khả kháng.",art4_3B:"4.3 This article shall not be applicable in Force Majeure cases.",art4_4:"4.4 Không bên nào có trách nhiệm bồi thường các thiệt hại gián tiếp nếu có phát sinh từ hợp đồng này.",art4_4B:"4.4 Neither party shall be liable for indirect damages which arising from this contract (if any).",art5:"ĐIỀU 5: GIẢI QUYẾT TRANH CHẤP",art5B:"ARTICLE 5: DISPUTES",art5_body:"Bất cứ tranh chấp nào liên quan đến Hợp đồng sẽ được thương lượng giữa hai bên. Nếu hai bên không giải quyết được bằng thương lượng thì sẽ đưa ra Tòa án có thẩm quyền xem xét. Tòa án này sẽ giải quyết vụ việc theo quy tắc tố tụng hiện hành của pháp luật Việt Nam.",art5_bodyB:"The Purchaser and the Supplier shall make every effort to resolve amicably by direct informal negotiation. In case no settlement can be reached, the disputes would be submitted to the competent Court. This Court will resolve the case under the current procedural rules of the law of Vietnam.",art6:"ĐIỀU 6: ĐIỀU KHOẢN CHUNG",art6B:"ARTICLE 6: GENERAL PROVISIONS",art6_1:"Bất cứ bổ sung và/hoặc sửa đổi điều khoản nào của hợp đồng chỉ có giá trị khi được lập bằng văn bản và có xác nhận của hai bên.",art6_1B:"Amendments of or additional to this Contract shall only be effective upon written agreement signed by the Parties.",art6_2:"Hợp đồng này sẽ được các bên thực hiện theo qui định của pháp luật hiện hành của nước Cộng Hòa Xã Hội Chủ Nghĩa Việt Nam.",art6_2B:"This contract shall be implemented following the Vietnam's law.",art6_3:"Sau khi các bên thực hiện xong các nghĩa vụ được quy định trong hợp đồng này, nếu hai bên không có khiếu nại gì thì hợp đồng xem như được thanh lý.",art6_3B:"This contract is automatically liquidated when two parties finished their responsibilities regulated in this contract.",art6_4:"Hợp đồng này có hiệu lực kể từ ngày ký.",art6_4B:"This Contract shall become into force and effect from the date of signing.",art6_5:"Hợp đồng này được lập thành hai (02) bản song ngữ tiếng Việt và tiếng Anh. Mỗi bên giữ một (01) bản có giá trị như nhau. Trong trường hợp có sự sai khác giữa tiếng Anh và tiếng Việt thì tiếng Việt sẽ là căn cứ quyết định.",art6_5B:"This Contract is made and signed in two (02) copies in Vietnamese and English. Each party shall keep one (01) copy with equal validity. In the case of discrepancy, Vietnamese shall be governed.",itemsHeader:["STT","HÀNG HÓA / DỊCH VỤ","SL","ĐVT","ĐƠN GIÁ","VAT","THÀNH TIỀN"],itemsHeaderB:["NO.","COMMODITY/SERVICES","QTY","UNIT","UNIT PRICE","VAT","AMOUNT"],rowTotal:"THÀNH TIỀN:",rowTotalB:"SUBTOTAL:",rowVat:e=>`VAT (${e})`,rowVatB:e=>`VAT (${e})`,rowGrand:"TỔNG CỘNG:",rowGrandB:"TOTAL:",signSeller:"ĐẠI DIỆN BÊN BÁN",signSellerB:"THE SELLER",signBuyer:"ĐẠI DIỆN BÊN MUA",signBuyerB:"THE BUYER"}},Zy={natTitle1:"CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM",natTitle1b:"越南社会主义共和国",natTitle2:"Độc lập - Tự do - Hạnh phúc",natTitle2b:"独立 - 自由 - 幸福",title:"HỢP ĐỒNG MUA BÁN",titleB:"买卖合同",legalBasis:"Căn cứ Bộ Luật Thương mại đư
