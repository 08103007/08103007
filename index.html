-- 1. Báo giá
create table if not exists quotes (

  quote_number text,
  date text,
  customer text,
  status text default 'draft',
  total numeric default 0,
  payload jsonb,
  updated_at timestamp with time zone default timezone('utc'::text, now())
);

-- 2. Sản phẩm & Hàng hóa
create table if not exists products (
  id text primary key,
  name text,
  unit text,
  price numeric default 0,
  cost numeric default 0,
  vat_rate numeric default 8,
  image text,
  payload jsonb,
  updated_at timestamp with time zone default timezone('utc'::text, now())
);

-- 3. Khách hàng
create table if not exists customers (
  id text primary key,
  customer text,
  short_name text,
  contact text,
  address text,
  tax_id text,
  phone text,
  email text,
  notes text,
  payload jsonb,
  updated_at timestamp with time zone default timezone('utc'::text, now())
);

-- 4. Công việc
create table if not exists tasks (
  id text primary key,
  title text,
  description text,
  status text default 'todo',
  priority text default 'medium',
  progress numeric default 0,
  due_date text,
  quote_id text,
  payload jsonb,

);

-- 5. Ghi chú nội bộ
create table if not exists notes (
  id text primary key,
  title text,
  body text,
  pinned boolean default false,
  color text,
  payload jsonb,
  updated_at timestamp with time zone default timezone('utc'::text, now())
);

create table if not exists handovers (
  id text primary key,
  quote_id text,
  ref_num text,
  customer text,
  date text,
  payload jsonb,
  updated_at timestamp with time zone default timezone('utc'::text, now())
);

create table if not exists debt_reconciliations (
  id text primary key,
  ref_num text,
  buyer_name text,
  date_str text,
  amount numeric default 0,
  payload jsonb,
  updated_at timestamp with time zone default timezone('utc'::text, now())
);

-- 8. Đề nghị thanh toán
create table if not exists payment_requests (
  id text primary key,
  req_number text,
  buyer_name text,
  amount numeric default 0,
  payload jsonb,
  updated_at timestamp with time zone default timezone('utc'::text, now())
);
