ES",art5_body:"Bất cứ tranh chấp nào liên quan đến Hợp đồng sẽ được thương lượng giữa hai bên. Nếu hai bên không giải quyết được bằng thương lượng thì sẽ đưa ra Tòa án có thẩm quyền xem xét. Tòa án này sẽ giải quyết vụ việc theo quy tắc tố tụng hiện hành của pháp luật Việt Nam.",art5_bodyB:"The Purchaser and the Supplier shall make every effort to resolve amicably by direct informal negotiation. In case no settlement can be reached, the disputes would be submitted to the competent Court. This Court will resolve the case under the current procedural rules of the law of Vietnam.",art6:"ĐIỀU 6: ĐIỀU KHOẢN CHUNG",art6B:"ARTICLE 6: GENERAL PROVISIONS",art6_1:"Bất cứ bổ sung và/hoặc sửa đổi điều khoản nào của hợp đồng chỉ có giá trị khi được lập bằng văn bản và có xác nhận của hai bên.",art6_1B:"Amendments of or additional to this Contract shall only be effective upon written agreement signed by the Parties.",art6_2:"Hợp đồng này sẽ được các bên thực hiện theo qui định của pháp luật hiện hành của nước Cộng Hòa Xã Hội Chủ Nghĩa Việt Nam.",art6_2B:"This contract shall be implemented following the Vietnam's law.",art6_3:"Sau khi các bên thực hiện xong các nghĩa vụ được quy định trong hợp đồng này, nếu hai bên không có khiếu nại gì thì hợp đồng xem như được thanh lý.",art6_3B:"This contract is automatically liquidated when two parties finished their responsibilities regulated in this contract.",art6_4:"Hợp đồng này có hiệu lực kể từ ngày ký.",art6_4B:"This Contract shall become into force and effect from the date of signing.",art6_5:"Hợp đồng này được lập thành hai (02) bản song ngữ tiếng Việt và tiếng Anh. Mỗi bên giữ một (01) bản có giá trị như nhau. Trong trường hợp có sự sai khác giữa tiếng Anh và tiếng Việt thì tiếng Việt sẽ là căn cứ quyết định.",art6_5B:"This Contract is made and signed in two (02) copies in Vietnamese and English. Each party shall keep one (01) copy with equal validity. In the case of discrepancy, Vietnamese shall be governed.",itemsHeader:["STT","HÀN
