ời hạn được quy định ở điều 3, thì sẽ chịu phạt với lãi suất 0.2%/tuần trên giá trị hàng giao trễ nhưng không tính 1 tuần đầu. Tuy nhiên, tổng số tiền phạt không được vượt quá 2% tổng giá trị Hợp Đồng.",art4_1B:"4.1 If the Seller fails to deliver commodity on time as the regulation of Article 3, the Seller shall pay for penalty of 0.2%/week of the delayed value except the first week as grace period. However, total of compensation shall not exceed 2% of the total contract value.",art4_2:"4.2 Nếu bên Mua chậm thanh toán quá thời hạn được quy định ở điều 2, thì sẽ chịu phạt với lãi suất 0.2%/tuần trên giá trị thanh toán trễ. Tuy nhiên, tổng số tiền phạt không được vượt quá 2% tổng giá trị Hợp Đồng.",art4_2B:"4.2 If the Buyer fails to make payment on time as the regulation of Article 2, the Buyer shall pay for penalty of 0.2% of the delayed value per week. However, total of compensation shall not exceed 2% of the total contract value.",art4_3:"4.3 Điều khoản này sẽ không được áp dụng trong trường hợp Bất khả kháng.",art4_3B:"4.3 This article shall not be applicable in Force Majeure cases.",art4_4:"4.4 Không bên nào có trách nhiệm bồi thường các thiệt hại gián tiếp nếu có phát sinh từ hợp đồng này.",art4_4B:"4.4 Neither party shall be liable for indirect damages which arising from this contract (if any).",art5:"ĐIỀU 5: GIẢI QUYẾT TRANH CHẤP",art5B:"ARTICLE 5: DISPUTES",art5_body:"Bất cứ tranh chấp nào liên quan đến Hợp đồng sẽ được thương lượng giữa hai bên. Nếu hai bên không giải quyết được bằng thương lượng thì sẽ đưa ra Tòa án có thẩm quyền xem xét. Tòa án này sẽ giải quyết vụ việc theo quy tắc tố tụng hiện hành của pháp luật Việt Nam.",art5_bodyB:"The Purchaser and the Supplier shall make every effort to resolve amicably by direct informal negotiation. In case no settlement can be reached, the disputes would be submitted to the competent Court. This Court will resolve the case under the current procedural rules of the law of Vietnam.",art6:"ĐIỀU 6: ĐIỀU KHOẢN CHUNG",
